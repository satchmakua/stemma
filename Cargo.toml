[workspace]
resolver = "3"
members = [
    "crates/stem_core",
    "crates/stem_phonology",
    "crates/stem_lexicon",
    "crates/stem_soundchange",
    "crates/stem_genome",
    "crates/stem_export",
    "crates/stem_io",
    "crates/stem_cli",
    "crates/stem_ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# 1.88 for let-chains, which `stem_io/src/project.rs` already uses.
rust-version = "1.88"
license = "MIT"
authors = ["Satchel Hamilton"]
repository = "https://github.com/satchelhamilton/stemma"

# Pinned once here; every crate inherits with `dep.workspace = true`.
[workspace.dependencies]
stem_core = { path = "crates/stem_core", version = "0.1.0" }
stem_phonology = { path = "crates/stem_phonology", version = "0.1.0" }
stem_lexicon = { path = "crates/stem_lexicon", version = "0.1.0" }
stem_soundchange = { path = "crates/stem_soundchange", version = "0.1.0" }
stem_genome = { path = "crates/stem_genome", version = "0.1.0" }
stem_export = { path = "crates/stem_export", version = "0.1.0" }
stem_io = { path = "crates/stem_io", version = "0.1.0" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
ron = "0.12.2"
thiserror = "2.0.19"
anyhow = "1.0.104"
clap = { version = "4.6.2", features = ["derive"] }

# --- The M11 desktop UI (docs/adr/0013). ---
#
# `eframe`/`egui` draw with wgpu/glow directly — no system WebView, so the binary
# is self-contained and there is no browser engine, no JS runtime and no Node in
# the toolchain. Immediate mode suits a read-only inspector, which is all §20.5
# permits before editing.
eframe = "0.36.1"
egui = "0.36.1"
# The OS-native Open dialog. Small, and the only way "open a project" is an
# ordinary desktop gesture rather than a typed path.
rfd = "0.17.2"

# --- Randomness: pinned exactly, on purpose (see docs/adr/0005). ---
#
# `=` rather than caret: rand 0.9.0's changelog reads "Optimize distribution
# `Uniform` … (breaks value stability)", and `WeightedIndex` samples `Uniform`
# internally. A caret range would have shipped that silently, rewriting every
# generated language on an unrelated `cargo update`.
#
# `default-features = false` drops `std_rng` and `thread_rng`, so `StdRng` and
# `ThreadRng` are not in the API at all — nobody can reach for the documented
# non-portable generator even by accident. `chacha` re-exports `ChaCha20Rng`,
# whose keystream is a published algorithm with public test vectors and cannot
# drift. This is the real enforcement of DESIGN.md §9.4, not a lint.
rand = { version = "=0.10.2", default-features = false, features = ["std", "chacha"] }
# SHA-256 is frozen by FIPS 180-4, which moves seed expansion entirely outside
# the dependency-stability question. See `stem_core::rng`.
sha2 = "=0.11.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# The engine is full of linguistics domain logic; keep it honest but not noisy.
todo = "warn"
dbg_macro = "warn"

[profile.release]
lto = "thin"
